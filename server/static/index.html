<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ 魔兽崩溃分析大数据中心</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #3498db;
            --dark: #2c3e50;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f1c40f;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
        }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { 
            background: linear-gradient(135deg, var(--dark) 0%, #34495e 100%); 
            color: white; padding: 30px; border-radius: 12px; margin-bottom: 25px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .card { 
            background: var(--card-bg); padding: 25px; border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-2px); }
        h2 { border-left: 5px solid var(--primary); padding-left: 15px; margin-top: 0; font-size: 1.25rem; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid #eee; }
        th { background-color: #fafafa; color: #666; font-weight: 600; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 0.8em; font-weight: bold; }
        .badge-danger { background-color: #fee2e2; color: var(--danger); border: 1px solid #fecaca; }
        .badge-info { background-color: #e0f2fe; color: var(--primary); border: 1px solid #bae6fd; }
        .badge-success { background-color: #dcfce7; color: var(--success); border: 1px solid #bbf7d0; }
        
        .filter-bar { 
            margin-top: 20px; display: flex; flex-wrap: wrap; justify-content: center; 
            gap: 15px; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px;
        }
        .filter-bar input, .filter-bar select { 
            padding: 10px 15px; border-radius: 6px; border: none; outline: none; min-width: 200px;
        }
        
        #total-count { font-size: 3rem; margin: 10px 0; color: var(--success); }
        .chart-container { position: relative; height: 250px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ 魔兽崩溃分析大数据中心</h1>
            <p>基于 JassView 内存指纹与 Game.dll 偏移量深度诊断</p>
            <div class="filter-bar">
                <select id="map-filter" onchange="fetchData()">
                    <option value="">📂 所有地图</option>
                </select>
                <input type="text" id="search-input" placeholder="🔍 搜索地图、地址或原因..." oninput="fetchData()">
            </div>
        </header>

        <div class="stats-grid">
            <div class="card">
                <h2>📊 活跃上报</h2>
                <div id="total-count">...</div>
                <p style="color: #888;">已接收的唯一崩溃样本数</p>
                <div class="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
            <div class="card">
                <h2>🗺️ 崩溃高发地图 (Top 5)</h2>
                <div class="chart-container">
                    <canvas id="mapChart"></canvas>
                </div>
            </div>
            <div class="card">
                <h2>⚠️ 常见崩溃原因</h2>
                <div class="chart-container">
                    <canvas id="reasonChart"></canvas>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>📜 实时诊断流 (最新 20 条)</h2>
            <table id="crash-table">
                <thead>
                    <tr>
                        <th style="width: 150px;">时间</th>
                        <th style="width: 180px;">地图名称</th>
                        <th style="width: 70px;">版本</th>
                        <th style="width: 120px;">归属</th>
                        <th style="width: 110px;">栈指纹</th>
                        <th style="width: 120px;">偏移地址</th>
                        <th>深度诊断结果</th>
                    </tr>
                </thead>
                <tbody id="crash-body">
                    <!-- Data will be inserted here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let mapChart = null;
        let reasonChart = null;
        let trendChart = null;

        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        async function fetchData() {
            const mapFilter = document.getElementById('map-filter').value;
            const searchInput = document.getElementById('search-input').value;
            let query = '?';
            if (mapFilter) query += `map=${encodeURIComponent(mapFilter)}&`;
            if (searchInput) query += `search=${encodeURIComponent(searchInput)}&`;

            try {
                const statsRes = await fetch(`/api/stats${query}`);
                const stats = await statsRes.json();
                
                document.getElementById('total-count').innerText = stats.total_reports;

                // Update filter dropdown
                const filter = document.getElementById('map-filter');
                if (filter.options.length <= 1) {
                    stats.maps.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m;
                        opt.text = m;
                        filter.add(opt);
                    });
                }

                // Map Chart (Pie)
                if (mapChart) mapChart.destroy();
                mapChart = new Chart(document.getElementById('mapChart'), {
                    type: 'doughnut',
                    data: {
                        labels: stats.top_maps.map(m => m.map_name),
                        datasets: [{
                            data: stats.top_maps.map(m => m.count),
                            backgroundColor: ['#3498db', '#e74c3c', '#f1c40f', '#2ecc71', '#9b59b6']
                        }]
                    },
                    options: { maintainAspectRatio: false }
                });

                // Reason Chart (Horizontal Bar)
                if (reasonChart) reasonChart.destroy();
                reasonChart = new Chart(document.getElementById('reasonChart'), {
                    type: 'bar',
                    data: {
                        labels: stats.top_reasons.map(r => r.reason.substring(0, 15) + '...'),
                        datasets: [{
                            label: '样本数',
                            data: stats.top_reasons.map(r => r.count),
                            backgroundColor: '#34495e'
                        }]
                    },
                    options: { 
                        indexAxis: 'y',
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } }
                    }
                });

                // Trend Chart (Line)
                if (trendChart) trendChart.destroy();
                trendChart = new Chart(document.getElementById('trendChart'), {
                    type: 'line',
                    data: {
                        labels: stats.trends.map(t => t.day),
                        datasets: [{
                            label: '日上报量',
                            data: stats.trends.map(t => t.count),
                            borderColor: '#2ecc71',
                            tension: 0.3,
                            fill: true,
                            backgroundColor: 'rgba(46, 204, 113, 0.1)'
                        }]
                    },
                    options: { 
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                    }
                });

                // Crashes Table
                const crashRes = await fetch(`/api/crashes${query}`);
                const crashes = await crashRes.json();
                const body = document.getElementById('crash-body');
                body.innerHTML = crashes.map(c => `
                    <tr>
                        <td style="color: #888; font-size: 0.9em;">${esc(new Date(c.timestamp).toLocaleString())}</td>
                        <td style="font-weight: 500;">${esc(c.map_name)}</td>
                        <td>${esc(c.game_version || '—')}</td>
                        <td>${esc(c.attribution || '—')}</td>
                        <td><code class="badge badge-info">${esc(c.fingerprint || '—')}</code></td>
                        <td><code class="badge badge-danger">${esc(c.crash_address)}</code></td>
                        <td>
                            <div style="font-size: 0.95em;">${esc(c.analysis_result)}</div>
                        </td>
                    </tr>
                `).join('');

            } catch (e) {
                console.error('Failed to fetch stats', e);
            }
        }

        fetchData();
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
